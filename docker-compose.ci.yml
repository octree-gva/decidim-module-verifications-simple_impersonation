# Local GitLab CI parity for ruby::rspec (ruby:3.4.7 + postgres:15 + redis).
# Not for interactive development — use docker-compose.yml.
#
#   docker compose -f docker-compose.ci.yml run --rm rspec

name: simple-impersonation-ci

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: decidim_test
      POSTGRES_USER: decidim
      POSTGRES_PASSWORD: "TEST-insecure_password"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decidim -d decidim_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:latest

  rspec:
    image: ruby:3.4.7
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: "TEST-insecure_password"
      DATABASE_USERNAME: decidim
      DISABLED_DOCKER_COMPOSE: "true"
      NODE_MAJOR: "20"
      SIMPLECOV: "1"
      CI: "1"
    entrypoint: []
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y ca-certificates curl gnupg libvips42t64
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_$$NODE_MAJOR.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
        printf 'Package: nodejs\nPin: origin deb.nodesource.com\nPin-Priority: 1001\n' > /etc/apt/preferences.d/nodesource
        apt-get update && apt-get install -y -qq nodejs
        npm install -g yarn --force
        gem install bundler
        bundle config set path vendor
        RAILS_ENV=development bundle install -j $$(nproc)
        bundle exec rake test_app
        RAILS_ENV=test bundle exec rspec spec/views
