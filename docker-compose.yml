services:
  simple_impersonation:
    container_name: decidim-simple_impersonation
    command: bash -c "sleep infinity"
    image: octree/decidim-dev:0.32
    entrypoint: ""
    working_dir: /home/module
    volumes:
      - .:/home/module
      - bundle:/home/decidim/vendor
      - node_modules:/home/decidim/node_modules
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://decidim:pleaseChangeMe@simple-impersonation-pg:5432/decidim
      - DATABASE_HOST=simple-impersonation-pg
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=decidim
      - DATABASE_PASSWORD=pleaseChangeMe
      - DEV_MODULE=decidim-verifications-simple_impersonation
      - RAILS_ENV=development
      - DISABLED_DOCKER_COMPOSE=true
      - DECIDIM_FORCE_SSL=false
      - DISABLE_SPRING=1
    depends_on:
      - simple-impersonation-pg
    ports:
      - 3000:3000
    links:
      - simple-impersonation-pg

  simple-impersonation-pg:
    container_name: decidim-simple_impersonation_pg
    image: postgres:17
    volumes:
      - simple-impersonation-pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DATABASE=decidim
      - POSTGRES_USER=decidim
      - POSTGRES_PASSWORD=pleaseChangeMe

volumes:
  node_modules: {}
  bundle: {}
  simple-impersonation-pg-data: {}
